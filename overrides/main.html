{% extends "base.html" %}

{% block extrahead %}
  {{ super() }}
  <meta name="robots" content="index, follow, max-image-preview:large, max-snippet:-1">
  <meta name="theme-color" content="#0b1220">
  <link rel="alternate" type="text/plain" title="llms.txt" href="{{ config.site_url }}llms.txt">
  {%- if page and page.meta and page.meta.schema %}
  <script type="application/ld+json">{{ page.meta.schema | tojson }}</script>
  {%- endif %}
  {%- if page and page.is_homepage %}
  <script type="application/ld+json">
  {
    "@context": "https://schema.org",
    "@graph": [
      {
        "@type": "Organization",
        "@id": "{{ config.site_url }}#org",
        "name": "PQBlocks",
        "url": "{{ config.site_url }}",
        "logo": "{{ config.site_url }}assets/logo.svg",
        "description": "Open engineering organisation for the post-quantum era: verified building blocks for post-quantum cryptography, migration, interoperability, conformance and quantum-inspired optimisation.",
        "parentOrganization": {"@type": "Organization", "name": "QubitRock"},
        "sameAs": ["https://github.com/PQBlocks", "https://pypi.org/search/?q=pqblocks"],
        "knowsAbout": ["Post-quantum cryptography", "ML-KEM", "FIPS 203", "ML-DSA", "FIPS 204", "SLH-DSA", "FIPS 205",
                       "Hybrid key exchange", "Cryptography bill of materials", "CNSA 2.0", "NIST ACVP", "QUBO", "Ising model"]
      },
      {
        "@type": "WebSite",
        "@id": "{{ config.site_url }}#site",
        "url": "{{ config.site_url }}",
        "name": "PQBlocks",
        "publisher": {"@id": "{{ config.site_url }}#org"},
        "inLanguage": "en"
      }
    ]
  }
  </script>
  {%- endif %}
{% endblock %}
