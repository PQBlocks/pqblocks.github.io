# One source for the FAQ page, the home page's short FAQ and the FAQPage JSON-LD.
# Each answer starts with the answer, stands alone when quoted, and links where to go next.
# home: true puts the question on the home page as well.
- section: PQBlocks
  items:
    - q: What is PQBlocks?
      home: true
      a: >-
        PQBlocks is an open-source engineering organisation that builds the components of a post-quantum
        migration as independent packages: post-quantum cryptography (ML-KEM, ML-DSA, SLH-DSA and hybrid
        modes), migration tooling (crypto inventory, CBOMs, readiness scoring, policy gates, CNSA 2.0
        evidence), interoperability (TLS, JOSE, wire formats, certificate requests), conformance testing
        against NIST ACVP vectors, and quantum-inspired optimisation. Each package lives in its own
        repository under [github.com/PQBlocks](https://github.com/PQBlocks), is licensed Apache-2.0,
        and ships its tests, benchmarks, primary sources and a verification report. PQBlocks is a
        QubitRock project.
    - q: Which PQBlocks package should I start with?
      home: true
      a: >-
        Start by finding the cryptography you already run. [`pqblocks-scan`](packages/scan.md) inventories
        RSA, elliptic curves, weak hashes and post-quantum algorithms in source code and TLS endpoints, and
        writes a CycloneDX 1.6 CBOM and a SARIF report. For new code, use
        [`pqblocks-primitives`](packages/primitives.md) for ML-KEM, ML-DSA and SLH-DSA,
        [`pqblocks-jose`](packages/jose.md) for post-quantum JWS and JWE tokens, and
        [`pqblocks-files`](packages/files.md) for file encryption. The [recipes](recipes/index.md) are
        complete, tested programs for the common tasks.
    - q: How do I install PQBlocks packages?
      a: >-
        Each package installs on its own with pip. Packages already on PyPI install with
        `pip install pqblocks-<name>`; the rest install from their GitHub repository with
        `pip install git+https://github.com/PQBlocks/<repository>` while their PyPI release is staged.
        Every package page shows the exact command that works today. Packages that use post-quantum
        primitives need the [liboqs](https://openquantumsafe.org/liboqs/) shared library; their README
        explains how it is found.
    - q: Are PQBlocks packages production-ready?
      a: >-
        They are pre-1.0 alpha releases. They follow the NIST standards, test against official vectors
        where those exist and document their limits, but their APIs may still change between minor
        versions and none has had an external security audit. Treat them as you would any young
        security library: pin versions, read each package's `SECURITY_NOTES.md` and
        `VERIFICATION_REPORT.md`, and review the code paths you depend on.
    - q: Are PQBlocks packages FIPS validated?
      home: true
      a: >-
        No. PQBlocks packages implement or wire to the NIST standards FIPS 203, 204 and 205 and test
        against official vectors where those exist, but none of them is a FIPS 140-3 / CMVP validated
        cryptographic module, and none claims to be. If you need a validated module, use one, and treat
        PQBlocks components as the integration, inventory and verification layer around it.
    - q: What licence are PQBlocks packages under?
      a: >-
        Apache License 2.0, for every package, the MCP server, the agent skills and this site. You can use,
        modify and redistribute them commercially. Each algorithm cites its standard or paper in the
        package's `EVIDENCE.md`.
- section: The post-quantum transition
  items:
    - q: What is post-quantum cryptography?
      home: true
      a: >-
        Post-quantum cryptography (PQC) is public-key cryptography designed to stay secure against an
        attacker with a large quantum computer. It runs on today's ordinary computers. NIST standardised
        the first algorithms in August 2024: ML-KEM (FIPS 203) for key establishment, and ML-DSA
        (FIPS 204) and SLH-DSA (FIPS 205) for digital signatures. They replace RSA, Diffie–Hellman and
        elliptic-curve cryptography, which Shor's algorithm would break.
    - q: What does "harvest now, decrypt later" mean?
      a: >-
        It is the attack in which encrypted traffic or files are recorded today and decrypted years later,
        once a cryptographically relevant quantum computer exists. It is why key establishment (TLS
        sessions, VPNs, encrypted archives) has to move to post-quantum algorithms before such a machine
        is built: data with a long confidentiality life is already exposed. Signatures are not harvested
        this way, but long-lived keys and trust anchors take years to replace.
    - q: When do we need to migrate to post-quantum cryptography?
      home: true
      a: >-
        Now, for planning and inventory. NIST's transition guidance (NIST IR 8547, draft) deprecates
        112-bit quantum-vulnerable algorithms such as RSA-2048 and P-256 after 2030 and disallows all
        quantum-vulnerable public-key algorithms after 2035. The NSA's CNSA 2.0 asks national security
        systems to prefer post-quantum algorithms from 2025 for software signing and web services and to
        use them exclusively between 2030 and 2033 depending on the system type. See the
        [transition map](transition-map.md) for the dates and sources.
    - q: What are ML-KEM, ML-DSA and SLH-DSA?
      a: >-
        They are the three NIST post-quantum standards published in August 2024. ML-KEM (FIPS 203,
        formerly Kyber) is a lattice-based key-encapsulation mechanism for agreeing on shared secrets.
        ML-DSA (FIPS 204, formerly Dilithium) is a lattice-based signature scheme. SLH-DSA (FIPS 205,
        formerly SPHINCS+) is a hash-based signature scheme with larger signatures and very conservative
        security assumptions. See the [glossary](glossary.md) for sizes and related terms.
    - q: Should I use hybrid or pure post-quantum cryptography?
      home: true
      a: >-
        During the transition, hybrid is the safer default: combine ML-KEM with X25519 for key
        establishment and pair ML-DSA with Ed25519 for signatures. An attacker then has to break both the
        lattice scheme and the classical one, which protects you if either has an implementation flaw or
        an unexpected cryptanalytic result. TLS 1.3 already uses the hybrid group X25519MLKEM768.
        Requirements such as CNSA 2.0 eventually call for post-quantum algorithms on their own, so prefer
        designs where a policy setting moves you from hybrid to pure.
    - q: Does TLS already support post-quantum key exchange?
      a: >-
        Yes. TLS 1.3 negotiates the hybrid group X25519MLKEM768, which combines X25519 with ML-KEM-768,
        and major browsers, CDNs and recent OpenSSL releases support it. Whether your own endpoints use it
        depends on your TLS library and configuration. [`pqblocks-tls-interop`](packages/tls-interop.md)
        probes an endpoint, reports the negotiated group and flags downgrades to classical key exchange.
    - q: What is a CBOM?
      a: >-
        A Cryptography Bill of Materials lists the cryptographic algorithms, keys, protocols and
        certificates a system uses, in a machine-readable format such as CycloneDX. It is to cryptography
        what an SBOM is to dependencies, and it is the starting point for planning a post-quantum migration
        and proving progress. [`pqblocks-scan`](packages/scan.md) produces one from source code, and
        [`pqblocks-cbom`](packages/cbom.md) enriches it with quantum-safety and CNSA 2.0 classifications.
- section: Using the packages
  items:
    - q: How do I sign JWTs with a post-quantum algorithm in Python?
      a: >-
        Use [`pqblocks-jose`](packages/jose.md): generate a composite ML-DSA-65 + Ed25519 key pair, define a
        policy that pins the algorithms, sign with `encode_jws` and verify with `decode_jws`. Both
        signatures must verify for the token to be accepted. Expect tokens of about 4.6 KB, since an
        ML-DSA-65 signature alone is 3,309 bytes. The [complete recipe](recipes/jwt-ml-dsa.md) runs as
        written.
    - q: How do I find RSA and elliptic-curve cryptography in my code?
      a: >-
        Run [`pqblocks-scan`](packages/scan.md) over the source tree. It parses Python by syntax tree and
        other languages by pattern, marks each algorithm as quantum-vulnerable or not with its file and
        line, grades readiness from A to F and writes a CycloneDX 1.6 CBOM and a SARIF report for code
        scanning. For Python data flow, [`pqblocks-lint`](packages/lint.md) follows keys from where they
        are made to where they are used. See [the audit recipe](recipes/crypto-audit.md).
    - q: Is the quantum-inspired work cryptography?
      a: >-
        No. The quantum-inspired packages are classical optimisation algorithms (simulated bifurcation,
        simulated and simulated-quantum annealing, population annealing, digital-annealer-style search and
        quantum-inspired evolutionary algorithms) for QUBO and Ising problems such as Max-Cut, scheduling
        and portfolio selection. They run on ordinary CPUs, make no security claims and are kept in their
        own area so they are never mistaken for cryptography.
    - q: How do AI coding assistants use PQBlocks?
      home: true
      a: >-
        Add the [`pqblocks-mcp`](ai/mcp.md) server to Claude Code, Cursor or any MCP client. It recommends a
        package for a task, returns its install line and a quickstart executed against the real package,
        and flags quantum-vulnerable algorithms in pasted code. The [Claude skill and Cursor rules](ai/skills.md)
        give the same guidance without a server, and [`llms.txt`](llms.txt) and
        [`llms-full.txt`](llms-full.txt) give agents the whole catalog in one file.
    - q: How do I report a security vulnerability?
      a: >-
        Privately, through GitHub private vulnerability reporting on the affected repository
        (`https://github.com/PQBlocks/<repository>/security/advisories/new`). Do not open a public issue.
        Reports are acknowledged within 3 working days, assessed within 10, and normally fixed and
        disclosed within 90 days in agreement with the reporter. See [security posture](security/security-notes.md).
