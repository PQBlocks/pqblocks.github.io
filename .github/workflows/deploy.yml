name: Publish site

# The site is the hub of the organisation's catalog. On a schedule (or on demand, or when a package
# repository sends a "package-released" dispatch) it finds every repository tagged `pqblocks`, runs each
# package's quickstart against its source, and regenerates the package pages, navigation, diagrams,
# llms feeds and the published catalog.json that pqblocks-mcp and pqblocks-skills sync from.
# A package that fails its quickstart, has no area topic or trips the public-text gate is held back
# with the reason in the run log; the rest still publish. A push to main rebuilds what is committed.

on:
  push:
    branches: [main]
  schedule:
    - cron: "17 */6 * * *"
  workflow_dispatch:
  repository_dispatch:
    types: [package-released]

permissions:
  contents: write

concurrency:
  group: publish
  cancel-in-progress: false

env:
  NO_MKDOCS_2_WARNING: "1"
  LIBOQS_TAG: "0.16.0"

jobs:
  publish:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1  # v7.0.1
        with:
          fetch-depth: 0              # full history: "last updated" dates on every page
      - uses: actions/setup-python@6d4fd22b20465ccc0f7354476588e8df7c9ca0e0  # v7.1.0
        with:
          python-version: "3.12"
      - name: System libraries (social cards, liboqs build)
        run: sudo apt-get update && sudo apt-get install -y libcairo2-dev libfreetype6-dev libffi-dev libjpeg-dev libpng-dev libz-dev cmake ninja-build libssl-dev

      - name: Fetch every package repository
        if: github.event_name != 'push'
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          mkdir -p ../packages
          gh repo list PQBlocks --topic pqblocks --no-archived --limit 300 --json name --jq '.[].name' |
            while read -r repo; do git clone --quiet --depth 1 "https://github.com/PQBlocks/$repo" "../packages/$repo"; done
          ls ../packages | wc -l

      - name: Build liboqs ${{ env.LIBOQS_TAG }}
        if: github.event_name != 'push'
        run: |
          git clone --quiet --depth 1 --branch "$LIBOQS_TAG" https://github.com/open-quantum-safe/liboqs ../liboqs
          cmake -S ../liboqs -B ../liboqs/build -GNinja -DBUILD_SHARED_LIBS=ON -DOQS_BUILD_ONLY_LIB=ON -DCMAKE_INSTALL_PREFIX="$HOME/.local"
          cmake --build ../liboqs/build && cmake --install ../liboqs/build
          echo "LD_LIBRARY_PATH=$HOME/.local/lib" >> "$GITHUB_ENV"
          echo "OQS_INSTALL_PATH=$HOME/.local" >> "$GITHUB_ENV"
          echo "OQS_LIB_PATH=$(ls $HOME/.local/lib/liboqs.so.* | head -1)" >> "$GITHUB_ENV"

      - name: Rebuild the catalog (runs every quickstart and every recipe)
        if: github.event_name != 'push'
        run: |
          python -m venv ../venv
          ../venv/bin/pip install --quiet --upgrade pip
          python3 scripts/build_catalog.py ../packages --print-deps > ../deps.txt
          ../venv/bin/pip install --quiet -r ../deps.txt fastapi httpx
          ../venv/bin/python scripts/build_catalog.py ../packages --verify
          ../venv/bin/python scripts/check_recipes.py ../packages

      - run: pip install -r requirements-docs.txt

      - name: Regenerate pages, diagrams and figures
        run: |
          python3 scripts/gen_docs.py
          python3 scripts/gen_diagrams.py
          python3 scripts/gen_figures.py

      - name: Public-text gate
        run: python3 scripts/leak_check.py docs data mkdocs.yml README.md overrides figures

      - name: Committed pages must match the catalog
        if: github.event_name == 'push'
        run: |
          git diff --exit-code -- docs data mkdocs.yml || { echo "generated files are stale, run the scripts and commit"; exit 1; }

      - name: Commit the refreshed catalog
        if: github.event_name != 'push'
        run: |
          git add data docs mkdocs.yml
          if git diff --cached --quiet; then echo "catalog unchanged"; exit 0; fi
          git -c user.name=MrGovindDubey -c user.email=govinddubeycse@gmail.com commit -m "docs: refresh package catalog"
          git push

      - run: mkdocs build --strict
      - run: mkdocs gh-deploy --force --no-history
